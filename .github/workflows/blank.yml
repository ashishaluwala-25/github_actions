name: test
on: 
  push:
    branches:
      - main
      - feature
      - releases
  pull_request: 
    types: 
      - opened
    branches: 
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: pwd
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: du -h
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: echo "test ${{ secrets.test }}"
      - run: echo "TEST ${{ vars.TEST }}"
